<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bigray Studio</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111827;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
            line-height: 1.8;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 40px;
            background-color: #1f2937;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
            color: #f9fafb;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 50px;
            font-size: 18px;
        }

        .game-section {
            margin-bottom: 50px;
            padding-bottom: 35px;
            border-bottom: 1px solid #374151;
        }

        .game-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        h2 {
            font-size: 30px;
            color: #f3f4f6;
            margin-bottom: 16px;
        }

        p {
            color: #d1d5db;
            margin-bottom: 18px;
        }

        .tag-container {
            margin-bottom: 20px;
        }

        .tag {
            display: inline-block;
            background-color: #374151;
            color: #dbeafe;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 14px;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #374151;
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
